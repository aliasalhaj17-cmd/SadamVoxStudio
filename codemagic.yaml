workflows:
  android-workflow:
    name: SADAM VOX Build Workflow
    max_build_duration: 15
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Auto Create Android Studio Environment
        script: |
          flutter create . --platforms=android --no-overwrite
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Force Resolve Dependencies and Build
        script: |
          flutter pub get
          flutter build apk --release --no-validate-project
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
