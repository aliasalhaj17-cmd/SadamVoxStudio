workflows:
  android-workflow:
    name: SADAM VOX Build
    max_build_duration: 10
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Create Dummy Android Folder
        script: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Build Android APK
        script: |
          flutter build apk --release --no-pub --no-validate-project
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
